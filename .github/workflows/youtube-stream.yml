name: Stream Earthquake Globe to YouTube

on:
  workflow_dispatch:      # lets you start it manually from the Actions tab
  schedule:
    - cron: '0 */5 * * *' # re-launch every 5h, safely under GitHub's 6h job cap

# Only one stream job at a time — a new scheduled run cancels a stale one
# instead of two ffmpeg processes fighting over the same YouTube stream key.
concurrency:
  group: eq-youtube-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # ~5h40m, comfortably inside the 6h hosted-runner limit
    # This image already has Chromium + every OS dependency it needs baked in,
    # so the job never has to run `playwright install --with-deps` again —
    # that download was almost all of your 5m51s. Only ffmpeg/xvfb (small, fast
    # apt packages) and `npm install` (no browser download, versions already
    # match) run per-job now.
    container:
      image: mcr.microsoft.com/playwright:v1.47.0-jammy
      options: --ipc=host   # Chrome recommendation — avoids OOM crashes in containers
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + Xvfb + python3
        run: apt-get update && apt-get install -y ffmpeg xvfb python3

      - name: Install JS deps (browsers already baked into the image)
        working-directory: stream
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install

      - name: Serve the dashboard file
        run: |
          nohup python3 -m http.server 8080 > server.log 2>&1 &
          sleep 2

      - name: Prepare browser launch script
        working-directory: stream
        run: |
          # Pulled out into its own script (rather than inline in the next
          # step) so the retry loop in "Stream to YouTube" can call the
          # exact same launch sequence again later if Chrome dies mid-stream,
          # without duplicating the flags in two places.
          cat > /tmp/launch-browser.sh << 'EOS'
          #!/usr/bin/env bash
          set -e
          cd "$GITHUB_WORKSPACE/stream"

          # Xvfb may already be running on a relaunch — only start it once.
          if ! pgrep -f "Xvfb :99" > /dev/null; then
            Xvfb :99 -screen 0 1280x720x24 -ac &
            sleep 2
          fi
          export DISPLAY=:99

          CHROME_BIN=$(node print-chrome-path.js)
          echo "Chrome binary: $CHROME_BIN"

          # Launched as a plain process (not via Playwright's launch()) so
          # there's no CDP/remote-debugging layer fighting with --kiosk.
          # --app opens a chrome-less window on top of --kiosk's fullscreen,
          # belt-and-suspenders against any address bar/tab strip showing up.
          # ?stream=1 tells the page to drop into its lighter render path
          # (no AA, smaller textures/geometry, capped to 30fps) — see
          # earthquake-dashboard.html.
          rm -rf /tmp/chrome-profile
          nohup "$CHROME_BIN" \
            --kiosk \
            --app="http://localhost:8080/earthquake-dashboard.html?stream=1" \
            --window-position=0,0 \
            --window-size=1280,720 \
            --start-fullscreen \
            --no-first-run \
            --no-default-browser-check \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-features=TranslateUI \
            --autoplay-policy=no-user-gesture-required \
            --use-gl=angle \
            --use-angle=swiftshader-webgl \
            --ignore-gpu-blocklist \
            --enable-webgl \
            --no-sandbox \
            --disable-dev-shm-usage \
            --noerrdialogs \
            --user-data-dir=/tmp/chrome-profile \
            > /tmp/browser.log 2>&1 &
          sleep 10
          cat /tmp/browser.log || true
          EOS
          chmod +x /tmp/launch-browser.sh

      - name: Start virtual display + browser
        run: /tmp/launch-browser.sh

      - name: Stream to YouTube (horizontal + vertical dual stream)
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          YOUTUBE_STREAM_KEY_VERTICAL: ${{ secrets.YOUTUBE_STREAM_KEY_VERTICAL }}
          DISPLAY: ':99'
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$YOUTUBE_STREAM_KEY_VERTICAL" ]; then
            echo "ERROR: YOUTUBE_STREAM_KEY_VERTICAL secret is not set."
            echo "Get it from YouTube Studio > Create > Go live > Stream tab > Dual stream >"
            echo "switch from 'Auto' to 'Encoder', then copy the vertical stream key."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # --- Self-healing loop -------------------------------------------
          # ffmpeg (or the browser feeding it) can die mid-stream — a YouTube
          # ingest hiccup, Chrome crashing under SwiftShader, a transient x11
          # error. Previously any of those would end the whole job and leave
          # the stream dark for up to 5h until the next cron tick. Now: on
          # exit, check whether Chrome is still alive; relaunch it if not,
          # then just restart ffmpeg. Capped at 50 restarts with a short
          # backoff so a genuinely broken config fails the job (and shows up
          # in the Actions log / watchdog) instead of looping silently
          # forever and burning the whole timeout on empty retries.
          MAX_RESTARTS=50
          attempt=0

          while [ "$attempt" -lt "$MAX_RESTARTS" ]; do
            attempt=$((attempt + 1))
            echo "=== ffmpeg attempt $attempt/$MAX_RESTARTS ==="

            if ! pgrep -f "\-\-kiosk" > /dev/null; then
              echo "Chrome isn't running — relaunching browser before starting ffmpeg."
              /tmp/launch-browser.sh
            fi

            # Audio: three quiet lavfi sources mixed into a low ambient drone
            # (two sub-bass sine tones + a whisper of pink noise) instead of
            # anullsrc dead silence. Nothing external to license, just tone
            # generators — keeps the stream from reading as "broken" to anyone
            # who taps in with sound on, without competing with the visuals.
            # -thread_queue_size gives x11grab enough buffer that a momentary
            # scheduling hiccup on the shared runner doesn't drop a grab.
            # -preset ultrafast frees as much CPU as possible back to the
            # browser AND the second concurrent encode below — two
            # simultaneous x264 encodes at 1080p/30fps clocked in at
            # speed=0.7x on GitHub's 2-vCPU runners (falling behind
            # realtime, guaranteed to buffer), so both resolution and fps
            # were cut on top of the faster preset until real numbers say
            # it's keeping up (watch for speed>=1.0x in the logs).
            #
            # --- Dual stream (horizontal + vertical) ------------------------
            # [0:v]split=2 duplicates the raw 1280x720 capture into two legs
            # BEFORE any scaling:
            #   vsrc_h -> sent at its native 1280x720 (no upscale — that was
            #             pure encode cost with zero real detail gain),
            #             just capped to 24fps, to the horizontal stream key.
            #   vsrc_v -> full 1280x720 frame scaled down to fit a 720px
            #             width (720x405, same 16:9 shape, nothing cut off),
            #             then padded with black bars top and bottom up to
            #             720x1280 so the whole dashboard stays visible —
            #             sent to the vertical stream key YouTube gives you
            #             under Dual stream > Encoder.
            # pad=720:1280:0:437 -> x=0 (already full width), y=437 centers
            # the 405px-tall image vertically in the 1280px-tall canvas
            # ((1280-405)/2 ≈ 437). If you'd rather crop-and-zoom (lose the
            # edges but no black bars) instead of letterboxing, swap back to
            # crop=405:720:437:0,scale=720:1280.
            # If speed is still below 1.0x after this, next levers: drop
            # x11grab's own -framerate below 30, or drop the vertical leg
            # entirely and rely on YouTube's Auto crop instead of an encoder
            # feed for it.
            # Both legs are pushed in ONE ffmpeg process as two separate
            # -f flv outputs — not two processes fighting over resources.
            # A filtergraph output pad can only be -map'd into ONE output,
            # so the mixed audio ([amixed]) is run through asplit=2 to make
            # two independent copies ([aout1], [aout2]), one per stream —
            # same idea as the video split above, just for audio.
            set +e
            ffmpeg -hide_banner -loglevel info \
              -thread_queue_size 1024 \
              -f x11grab -draw_mouse 0 -video_size 1280x720 -framerate 30 -i "$DISPLAY" \
              -f lavfi -i "sine=f=55:r=48000" \
              -f lavfi -i "sine=f=82.41:r=48000" \
              -f lavfi -i "anoisesrc=colour=pink:amplitude=0.02:sample_rate=48000" \
              -filter_complex "\
                [0:v]split=2[vsrc_h][vsrc_v]; \
                [vsrc_h]fps=24[vout_h]; \
                [vsrc_v]scale=720:405:flags=lanczos,pad=720:1280:0:437:color=black,fps=24[vout_v]; \
                [1:a]volume=0.05,tremolo=f=0.15:d=0.3[a1]; \
                [2:a]volume=0.035[a2]; \
                [3:a]volume=0.015[a3]; \
                [a1][a2][a3]amix=inputs=3:duration=longest:normalize=0[amixed]; \
                [amixed]asplit=2[aout1][aout2]" \
              -map "[vout_h]" -map "[aout1]" \
              -c:v libx264 -preset ultrafast -tune zerolatency -x264-params "aq-mode=2" \
              -b:v 4500k -maxrate 4500k -bufsize 9000k \
              -g 48 -keyint_min 48 -sc_threshold 0 -pix_fmt yuv420p \
              -c:a aac -b:a 128k -ar 48000 -ac 2 \
              -f flv "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}" \
              -map "[vout_v]" -map "[aout2]" \
              -c:v libx264 -preset ultrafast -tune zerolatency -x264-params "aq-mode=2" \
              -b:v 2500k -maxrate 2500k -bufsize 5000k \
              -g 48 -keyint_min 48 -sc_threshold 0 -pix_fmt yuv420p \
              -c:a aac -b:a 128k -ar 48000 -ac 2 \
              -f flv "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY_VERTICAL}"
            code=$?
            set -e

            echo "ffmpeg exited with code $code."
            echo "Backing off 5s before restart attempt $((attempt + 1))..."
            sleep 5
          done

          echo "ERROR: ffmpeg failed $MAX_RESTARTS times in a row — giving up so the job reports failure."
          exit 1
